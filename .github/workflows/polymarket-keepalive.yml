name: Polymarket — resolution every 2h + Opus refresh every 12h

# Two-loop architecture matching the user's subscription budget:
#
#   • Resolution-only loop (every 2h): hits /api/polymarket/resolve-only.
#     Polls Polymarket Gamma API (free, no LLM). Closes resolved positions.
#     Updates bankroll history. Keeps Render container warm.
#
#   • Opus refresh loop (every 12h, 2x/day): hits /api/polymarket. Runs
#     the full Opus 4.7 screening pipeline (~55-market batch). Refreshes
#     the SWR cache so user dashboard visits always serve instantly with
#     picks ≤12h old. Exactly 2 Opus calls/day, predictable subscription
#     budget.
#
# Combined effect:
#   - User visits dashboard → instant load, picks already fresh from
#     latest 12h cron run.
#   - Open positions auto-resolve every 2h while user is offline.
#   - Total Opus calls: ~2/day (down from ~48 in the old "every 30min hits
#     /api/polymarket" pattern).
#
# To pause: disable the workflow in GitHub UI's Actions tab.
# To trigger manually: 'Run workflow' button on the same tab.

on:
  schedule:
    # Resolve-only: every 2 hours (12 invocations/day, ~5-15s each).
    - cron: "0 */2 * * *"
    # Opus refresh: every 12 hours (2 invocations/day at 06:00 and 18:00 UTC).
    # Aligned to roughly bracket waking hours globally — first run early
    # morning Asia/EU, second early evening Americas. User can adjust.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}  # also allow manual trigger from Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine which loop to run
        id: which
        run: |
          # Match the cron schedule that triggered this run. GitHub Actions
          # exposes the schedule via $GITHUB_EVENT_PATH event.schedule.
          # Hour-of-day check is the cheapest way to differentiate.
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ] || [ "$HOUR" = "18" ]; then
            echo "kind=opus" >> $GITHUB_OUTPUT
            echo "url=https://trade-os-swarm.onrender.com/api/polymarket" >> $GITHUB_OUTPUT
            echo "timeout=540" >> $GITHUB_OUTPUT
            echo "[$(date -u +%FT%TZ)] OPUS REFRESH cycle (12h cadence)"
          else
            echo "kind=resolve" >> $GITHUB_OUTPUT
            echo "url=https://trade-os-swarm.onrender.com/api/polymarket/resolve-only" >> $GITHUB_OUTPUT
            echo "timeout=60" >> $GITHUB_OUTPUT
            echo "[$(date -u +%FT%TZ)] RESOLVE-ONLY cycle (2h cadence)"
          fi

      - name: Hit endpoint
        run: |
          set -euo pipefail
          URL="${{ steps.which.outputs.url }}"
          TIMEOUT="${{ steps.which.outputs.timeout }}"
          KIND="${{ steps.which.outputs.kind }}"
          echo "→ $URL (timeout=${TIMEOUT}s, kind=$KIND)"
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time "$TIMEOUT" \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions-${KIND}-cron" \
            "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Non-200 response — dumping body:"
            head -c 2000 /tmp/resp.json || true
            exit 1
          fi
          # Log the right summary for whichever loop ran
          python3 -c "
          import json
          d = json.load(open('/tmp/resp.json'))
          kind = '$KIND'
          if kind == 'opus':
              stats = d.get('stats', {}) or {}
              funnel = d.get('funnel', {}) or {}
              errs = d.get('screeningErrors', []) or []
              opps = len(d.get('opportunities', []) or [])
              print(f'cache={d.get(\"cacheStatus\",\"?\")} screened={stats.get(\"marketsScreened\",0)} opps={opps} errs={len(errs)}')
              print(f'funnel: t1={funnel.get(\"t1Selected\",0)}/{funnel.get(\"t1Universe\",0)} t2={funnel.get(\"t2Selected\",0)}/{funnel.get(\"t2Universe\",0)} t3={funnel.get(\"t3Selected\",0)}/{funnel.get(\"t3Universe\",0)}')
              for e in errs[:3]: print(' ERR:', e[:200])
          else:
              p = d.get('portfolio', {}) or {}
              print(f'resolved={d.get(\"resolved\",0)} errors={len(d.get(\"errors\",[]))}')
              print(f'portfolio: bankroll=\${p.get(\"bankroll\",0):.2f} won={p.get(\"wonTrades\",0)} lost={p.get(\"lostTrades\",0)} open={p.get(\"openPositions\",0)}')
              for e in (d.get('errors') or [])[:3]: print(' ERR:', e[:200])
          "
