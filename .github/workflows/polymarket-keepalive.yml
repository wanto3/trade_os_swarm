name: Polymarket resolution + keep-alive (Opus-free)

# Pings the prod /api/polymarket/resolve-only every 2 hours.
#
# IMPORTANT: this endpoint does NOT trigger the Opus screening pipeline.
# It only:
#   1. Polls Polymarket Gamma API for closed markets (free, no LLM).
#   2. Resolves matching open positions and updates bankroll history.
#   3. Records the daily-performance snapshot.
#   4. Returns a small summary.
#
# Why not hit /api/polymarket directly? That endpoint runs the Opus 4.7
# pipeline (~55-market batch) when cache is stale, burning Max-subscription
# resources for picks the user already placed. Per user instruction:
# "only use Claude Opus Max when we open the dashboard or about to look
# for opportunities, not running all the time in the background."
#
# Frequency: every 2 hours. Most prediction markets close at predictable
# times (election close, sports event end), and resolution typically lands
# 5-30 min after. 2-hour intervals catch ~99% of resolutions within 2 hours
# of close — fast enough for a daily-trading flow.
#
# To pause: disable the workflow in GitHub UI's Actions tab.
# To trigger manually: 'Run workflow' button on the same tab.

on:
  schedule:
    # Every 2 hours UTC (12 invocations/day). Even on Render free-tier the
    # 15-min idle sleep is a non-issue here because resolution runs are
    # short (~5-15s) and the dashboard cache stays warm independently.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # also allow manual trigger from Actions UI

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit resolve-only endpoint
        run: |
          set -euo pipefail
          URL="https://trade-os-swarm.onrender.com/api/polymarket/resolve-only"
          echo "[$(date -u +%FT%TZ)] Pinging $URL"
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time 60 \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions-resolution-cron" \
            "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Non-200 response — dumping body:"
            head -c 2000 /tmp/resp.json || true
            exit 1
          fi
          # Log resolution summary (no market data leaked)
          python3 -c "
          import json
          d = json.load(open('/tmp/resp.json'))
          p = d.get('portfolio', {}) or {}
          print(f'resolved={d.get(\"resolved\",0)} errors={len(d.get(\"errors\",[]))}')
          print(f'portfolio: bankroll=\${p.get(\"bankroll\",0):.2f} won={p.get(\"wonTrades\",0)} lost={p.get(\"lostTrades\",0)} open={p.get(\"openPositions\",0)}')
          for e in (d.get('errors') or [])[:3]: print(' ERR:', e[:200])
          "
