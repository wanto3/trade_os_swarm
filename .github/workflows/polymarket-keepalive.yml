name: Polymarket — resolution every 2h + Opus refresh 1x/day

# User's chosen subscription budget pattern:
#   "Idle day 1-2 cron job only. When we visit then more is fine."
#
# Translates to:
#   - Resolution-only loop (every 2h, free, no Opus): polls Polymarket
#     Gamma API to close resolved positions, updates bankroll history,
#     keeps Render container warm. Zero LLM cost.
#   - Opus refresh loop (1x/day at 06:00 UTC): pre-warms the SWR cache
#     so the first morning dashboard visit is instant. Also runs the
#     resolution pass as a free side-effect.
#
# Combined with FRESH_TTL=1h and STALE_TTL=8h in the API:
#   - Idle day: 1 Opus call (the 6am cron).
#   - Active day with multiple visits: 1-4 Opus calls — cron + each
#     spaced-out visit triggers a stale-revalidate background refresh.
#   - Heavy reload spam in a single session: 1-2 (FRESH gate dominates).
#
# To pause: disable the workflow in GitHub UI's Actions tab.
# To trigger manually: 'Run workflow' button on the same tab.

on:
  schedule:
    # Resolve-only: every 2 hours UTC (12 hits/day, ~5-15s each).
    - cron: "0 */2 * * *"
    # Opus refresh: 1x/day at 06:00 UTC (1 hit/day, ~5-7 min).
    # Picked early-morning UTC so the first daily dashboard visit
    # (whatever the user's TZ) lands on warm cache.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # also allow manual trigger from Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine which loop to run
        id: which
        run: |
          # The 06:00 UTC slot is the Opus refresh. All others are resolve-only.
          # Note: when both crons coincide (06:00 hour), GitHub fires both
          # schedules in the same workflow run; we route based on hour.
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ]; then
            echo "kind=opus" >> $GITHUB_OUTPUT
            echo "url=https://trade-os-swarm.onrender.com/api/polymarket" >> $GITHUB_OUTPUT
            echo "timeout=540" >> $GITHUB_OUTPUT
            echo "[$(date -u +%FT%TZ)] OPUS REFRESH (1x/day)"
          else
            echo "kind=resolve" >> $GITHUB_OUTPUT
            echo "url=https://trade-os-swarm.onrender.com/api/polymarket/resolve-only" >> $GITHUB_OUTPUT
            echo "timeout=60" >> $GITHUB_OUTPUT
            echo "[$(date -u +%FT%TZ)] RESOLVE-ONLY (2h cadence)"
          fi

      - name: Hit endpoint
        run: |
          set -euo pipefail
          URL="${{ steps.which.outputs.url }}"
          TIMEOUT="${{ steps.which.outputs.timeout }}"
          KIND="${{ steps.which.outputs.kind }}"
          echo "→ $URL (timeout=${TIMEOUT}s, kind=$KIND)"
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time "$TIMEOUT" \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions-${KIND}-cron" \
            "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Non-200 response — dumping body:"
            head -c 2000 /tmp/resp.json || true
            exit 1
          fi
          # Log the right summary for whichever loop ran
          python3 -c "
          import json
          d = json.load(open('/tmp/resp.json'))
          kind = '$KIND'
          if kind == 'opus':
              stats = d.get('stats', {}) or {}
              funnel = d.get('funnel', {}) or {}
              errs = d.get('screeningErrors', []) or []
              opps = len(d.get('opportunities', []) or [])
              print(f'cache={d.get(\"cacheStatus\",\"?\")} screened={stats.get(\"marketsScreened\",0)} opps={opps} errs={len(errs)}')
              print(f'funnel: t1={funnel.get(\"t1Selected\",0)}/{funnel.get(\"t1Universe\",0)} t2={funnel.get(\"t2Selected\",0)}/{funnel.get(\"t2Universe\",0)} t3={funnel.get(\"t3Selected\",0)}/{funnel.get(\"t3Universe\",0)}')
              for e in errs[:3]: print(' ERR:', e[:200])
          else:
              p = d.get('portfolio', {}) or {}
              print(f'resolved={d.get(\"resolved\",0)} errors={len(d.get(\"errors\",[]))}')
              print(f'portfolio: bankroll=\${p.get(\"bankroll\",0):.2f} won={p.get(\"wonTrades\",0)} lost={p.get(\"lostTrades\",0)} open={p.get(\"openPositions\",0)}')
              for e in (d.get('errors') or [])[:3]: print(' ERR:', e[:200])
          "
